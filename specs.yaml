# specs.yaml — i2ecws-lib generation manifest
#
# Drives generate.mjs. Each entry describes one OpenAPI spec and the
# generator targets to run against it.
#
# Fields:
#   name     - unique identifier; used as the output directory name
#   spec     - path to the OpenAPI spec file (YAML) relative to repo root
#   source   - for I2E-owned specs: source project path (relative to workspace root)
#              may include submodule, e.g. service-workspace/sm_i2e_gpmats_ws/aggregator
#   docs     - for external specs: wiki doc path or URL with API documentation
#   targets  - one key per enabled generator; values are merged with defaults below
#
# Generator keys: typescript-angular | java-client | java-server

# ---------------------------------------------------------------------------
# Defaults — applied to every target of the matching type unless overridden
# ---------------------------------------------------------------------------
defaults:
  java-client:
    groupId: gov.nih.nci.cbiit.scimgmt
    dateLibrary: java11
    library: resttemplate
    hideGenerationTimestamp: true
    jakarta: true
  java-server:
    groupId: gov.nih.nci.cbiit.scimgmt
    dateLibrary: java11
    interfaceOnly: true
    useSpringBoot3: true
    hideGenerationTimestamp: true
    jakarta: true
    useTags: true
  typescript-angular:
    ngVersion: "17"
    hideGenerationTimestamp: true

# ---------------------------------------------------------------------------
# I2E Services — all three targets
